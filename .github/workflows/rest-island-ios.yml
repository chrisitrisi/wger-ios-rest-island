name: Build wger with Rest Island
on:
  push:
    branches: [dynamic-island, feature/ios-workout-shortcuts, feature/ios-island-shortcuts, claude/wizardly-goodall-ulb5n6, claude/eager-turing-up8qoy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rest-island-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-common
      - name: Format new Dart file
        run: dart format lib/features/routines/notifications/workout_live_activity.dart
      - name: Prove Live Activity regression test detects missing platform calls
        run: |
          file=lib/features/routines/notifications/workout_live_activity.dart
          cp "$file" "$RUNNER_TEMP/workout_live_activity.dart"
          python3 - "$file" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          old = p.read_text()
          call = '''await WORKOUT_LIVE_ACTIVITY_CHANNEL.invokeMethod<void>(
                    content == null ? 'end' : 'sync',
                    content,
                  );'''
          assert call in old, 'platform call not found, update this step'
          p.write_text(old.replace(call, 'await Future<void>.value();'))
          PY
          if flutter test test/features/routines/notifications/workout_live_activity_test.dart; then
            cp "$RUNNER_TEMP/workout_live_activity.dart" "$file"
            echo 'Regression test did not detect the deliberately broken bridge'
            exit 1
          fi
          cp "$RUNNER_TEMP/workout_live_activity.dart" "$file"
      - name: Verify workout shortcut selection regression
        run: |
          cp lib/features/routines/workout_shortcuts.dart "$RUNNER_TEMP/shortcuts.dart"
          sed -i 's/ || day.isRest || / || /' lib/features/routines/workout_shortcuts.dart
          if flutter test test/features/routines/workout_shortcuts_test.dart; then
            echo "Selection regression was not detected"
            exit 1
          fi
          cp "$RUNNER_TEMP/shortcuts.dart" lib/features/routines/workout_shortcuts.dart
          flutter test test/features/routines/workout_shortcuts_test.dart
      - name: Prove shortcut test detects frame waits for background actions
        run: |
          cp lib/features/routines/workout_shortcuts.dart "$RUNNER_TEMP/shortcuts.dart"
          sed -i "s/const SHORTCUT_NAVIGATION_METHODS = {'start', 'finish', 'plans'};/const SHORTCUT_NAVIGATION_METHODS = {'start', 'finish', 'plans', 'log'};/" lib/features/routines/workout_shortcuts.dart
          grep -q "'plans', 'log'}" lib/features/routines/workout_shortcuts.dart
          if flutter test test/features/routines/workout_shortcuts_test.dart; then
            echo "Background frame regression was not detected"
            exit 1
          fi
          cp "$RUNNER_TEMP/shortcuts.dart" lib/features/routines/workout_shortcuts.dart
      - name: Analyze
        run: flutter analyze
      - name: Test rest and workout behavior
        run: flutter test test/features/routines/notifications test/features/routines/workout_shortcuts_test.dart test/features/routines/widgets/gym_mode/timer_test.dart test/features/routines/providers/gym_state_test.dart test/features/routines/providers/workout_session_repository_test.dart
  build:
    if: "!contains(github.event.head_commit.message, '[metadata-only]')"
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ./.github/actions/flutter-common
      - name: Version this build
        # SideStore only offers an update when the version moves, so every build gets its own:
        # 2.1.<100 + run number>, build number 290 + run number (above the last fixed 2.1.2 / 290).
        run: |
          echo "WGER_BUILD_NAME=2.1.$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "WGER_BUILD_NUMBER=$((290 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Configure native Live Activity
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure_rest_activity.rb
      - name: Build unsigned wger IPA
        run: |
          flutter build ios --release --no-codesign --build-name="$WGER_BUILD_NAME" --build-number="$WGER_BUILD_NUMBER"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          test -d dist/Payload/Runner.app/PlugIns/WgerRestWidget.appex
          /usr/libexec/PlistBuddy -c "Print NSSupportsLiveActivities" dist/Payload/Runner.app/Info.plist | grep true
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          root = Path('dist/Payload/Runner.app')
          metadata = json.loads((root / 'Metadata.appintents/extract.actionsdata').read_bytes())
          identifiers = {action['identifier'] for action in metadata['actions'].values()}
          expected = {'StartWorkoutAction', 'StartWithNoopAction', 'LogSetAction', 'SkipRestAction',
                      'ExtendRestAction', 'WorkoutStatusAction', 'FinishWorkoutAction', 'SaveWorkoutAction',
                      'OpenRoutinesAction', 'RestEndAction', 'RestRemainingAction',
                      'LogSetWithValuesAction', 'NextSetAction', 'WorkoutIslandIntent'}
          assert expected <= identifiers, sorted(expected - identifiers)
          for bundle in [root, *root.glob('PlugIns/*.appex')]:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              for key in ('CFBundleName', 'CFBundleIdentifier', 'CFBundleExecutable', 'CFBundleVersion', 'CFBundleShortVersionString'):
                  assert isinstance(info.get(key), str) and info[key].strip(), (bundle, key)
              assert (bundle / info['CFBundleExecutable']).is_file(), bundle
          PY
          # Embed the HealthKit capability so SideStore provisions it when it re-signs: an unsigned build
          # carries no entitlements, and without this one every Apple Health read and write is refused.
          APP=dist/Payload/Runner.app
          ENT="$RUNNER_TEMP/wger-sideload.entitlements"
          plutil -create xml1 "$ENT"
          plutil -insert 'com\.apple\.developer\.healthkit' -bool YES "$ENT"
          plutil -insert 'com\.apple\.developer\.healthkit\.access' -array "$ENT"
          codesign --force --deep --sign - "$APP"
          codesign --force --sign - --entitlements "$ENT" "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'com.apple.developer.healthkit'
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = "$WGER_BUILD_NAME"
          echo "$WGER_BUILD_NAME $WGER_BUILD_NUMBER" > dist/version.txt
          cd dist
          zip -qry wger-RestIsland-Shortcuts.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: wger-RestIsland-IPA
          path: |
            dist/wger-RestIsland-Shortcuts.ipa
            dist/version.txt

  download:
    # Every shortcuts build gets a downloadable IPA under Releases: pushes to the shortcut branches and
    # any manual run (Actions -> Run workflow, on whichever branch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/feature/ios-workout-shortcuts' ||
      github.ref == 'refs/heads/feature/ios-island-shortcuts' ||
      github.ref == 'refs/heads/claude/wizardly-goodall-ulb5n6' ||
      github.ref == 'refs/heads/claude/eager-turing-up8qoy'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wger-RestIsland-IPA
      - name: Publish SideStore download for this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="workout-shortcuts-${GITHUB_SHA:0:8}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" wger-RestIsland-Shortcuts.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" wger-RestIsland-Shortcuts.ipa --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "wger Rest Island · Workout-Kurzbefehle" \
              --notes "SideStore-IPA mit Live Activity für das ganze Workout (Buttons ab iOS 17) und 13 Kurzbefehle-Aktionen."
          fi
      - name: Point the SideStore source at this build
        # The source lives as an asset of the fixed `sidestore` release, so its URL never changes and no
        # branch has to be pushed to: SideStore reads
        # https://github.com/<owner>/<repo>/releases/download/sidestore/altstore-source.json
        # It names this fork's own identity (not upstream's), so SideStore keeps it apart from any other
        # wger source, and the version matches the IPA's CFBundleShortVersionString exactly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r name number < version.txt
          tag="workout-shortcuts-${GITHUB_SHA:0:8}"
          # What's New: the commit subjects since the build the current source points at (merges left out,
          # the conventional "type(scope): " prefix dropped), so SideStore shows what an update brings.
          notes=""
          prev_url=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/sidestore/altstore-source.json" 2>/dev/null \
                     | jq -r '.apps[0].versions[0].downloadURL // empty' || true)
          prev_tag=$(printf '%s' "$prev_url" | sed -nE 's#.*/releases/download/([^/]+)/.*#\1#p')
          if [ -n "$prev_tag" ] && [ "$prev_tag" != "$tag" ]; then
            notes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_SHA}" \
                      --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null \
                    | grep -vE '^Merge ' \
                    | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^(.)/\U\1/; s/^/• /' \
                    | head -15 || true)
          fi
          [ -n "$notes" ] || notes="Build ${number}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes" || true
          size=$(stat -c %s wger-RestIsland-Shortcuts.ipa)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/wger-RestIsland-Shortcuts.ipa"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" --arg name "$name" --arg number "$number" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg url "$url" --argjson size "$size" \
            --arg notes "$notes" '
            {
              name: "wger (chrisitrisi)",
              identifier: "at.chrisitrisi.wger.altstore",
              sourceURL: ("https://github.com/" + $repo + "/releases/download/sidestore/altstore-source.json"),
              website: ("https://github.com/" + $repo),
              subtitle: "Personal wger fork: Rest Island, workout shortcuts, water card.",
              apps: [{
                name: "wger",
                bundleIdentifier: "at.chrisitrisi.wger.rest",
                developerName: "wger community (fork)",
                subtitle: "Workouts, nutrition and body tracking.",
                localizedDescription: "wger with a workout Live Activity, Shortcuts actions and a daily water card that writes to Apple Health.",
                iconURL: ("https://raw.githubusercontent.com/" + $repo + "/master/ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png"),
                tintColor: "2A4C7D",
                version: $name, buildVersion: $number, versionDate: $date, versionDescription: $notes,
                downloadURL: $url, size: $size,
                versions: [{
                  version: $name, buildVersion: $number, date: $date,
                  localizedDescription: $notes, downloadURL: $url, size: $size,
                  minOSVersion: "15.0"
                }]
              }],
              news: []
            }' > altstore-source.json
          jq -e '.apps[0].version' altstore-source.json >/dev/null
          if ! gh release view sidestore --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create sidestore --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "SideStore-Quelle" \
              --notes "Diese Adresse in SideStore unter Sources hinzufügen: https://github.com/${GITHUB_REPOSITORY}/releases/download/sidestore/altstore-source.json"
          fi
          gh release upload sidestore altstore-source.json --clobber --repo "$GITHUB_REPOSITORY"
