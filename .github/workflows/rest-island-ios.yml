name: Build wger with Rest Island
on:
  push:
    branches: [dynamic-island, feature/ios-workout-shortcuts, feature/ios-island-shortcuts]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rest-island-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-common
      - name: Format new Dart file
        run: dart format lib/features/routines/notifications/workout_live_activity.dart
      - name: Prove Live Activity regression test detects missing platform calls
        run: |
          file=lib/features/routines/notifications/workout_live_activity.dart
          cp "$file" "$RUNNER_TEMP/workout_live_activity.dart"
          python3 - "$file" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          old = p.read_text()
          call = '''await WORKOUT_LIVE_ACTIVITY_CHANNEL.invokeMethod<void>(
                    content == null ? 'end' : 'sync',
                    content,
                  );'''
          assert call in old, 'platform call not found, update this step'
          p.write_text(old.replace(call, 'await Future<void>.value();'))
          PY
          if flutter test test/features/routines/notifications/workout_live_activity_test.dart; then
            cp "$RUNNER_TEMP/workout_live_activity.dart" "$file"
            echo 'Regression test did not detect the deliberately broken bridge'
            exit 1
          fi
          cp "$RUNNER_TEMP/workout_live_activity.dart" "$file"
      - name: Verify workout shortcut selection regression
        run: |
          cp lib/features/routines/workout_shortcuts.dart "$RUNNER_TEMP/shortcuts.dart"
          sed -i 's/ || day.isRest || / || /' lib/features/routines/workout_shortcuts.dart
          if flutter test test/features/routines/workout_shortcuts_test.dart; then
            echo "Selection regression was not detected"
            exit 1
          fi
          cp "$RUNNER_TEMP/shortcuts.dart" lib/features/routines/workout_shortcuts.dart
          flutter test test/features/routines/workout_shortcuts_test.dart
      - name: Prove shortcut test detects frame waits for background actions
        run: |
          cp lib/features/routines/workout_shortcuts.dart "$RUNNER_TEMP/shortcuts.dart"
          sed -i "s/const SHORTCUT_NAVIGATION_METHODS = {'start', 'finish', 'plans'};/const SHORTCUT_NAVIGATION_METHODS = {'start', 'finish', 'plans', 'log'};/" lib/features/routines/workout_shortcuts.dart
          grep -q "'plans', 'log'}" lib/features/routines/workout_shortcuts.dart
          if flutter test test/features/routines/workout_shortcuts_test.dart; then
            echo "Background frame regression was not detected"
            exit 1
          fi
          cp "$RUNNER_TEMP/shortcuts.dart" lib/features/routines/workout_shortcuts.dart
      - name: Analyze
        run: flutter analyze
      - name: Test rest and workout behavior
        run: flutter test test/features/routines/notifications test/features/routines/workout_shortcuts_test.dart test/features/routines/widgets/gym_mode/timer_test.dart test/features/routines/providers/gym_state_test.dart test/features/routines/providers/workout_session_repository_test.dart
  build:
    if: "!contains(github.event.head_commit.message, '[metadata-only]')"
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ./.github/actions/flutter-common
      - name: Configure native Live Activity
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure_rest_activity.rb
      - name: Build unsigned wger IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          test -d dist/Payload/Runner.app/PlugIns/WgerRestWidget.appex
          /usr/libexec/PlistBuddy -c "Print NSSupportsLiveActivities" dist/Payload/Runner.app/Info.plist | grep true
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          root = Path('dist/Payload/Runner.app')
          metadata = json.loads((root / 'Metadata.appintents/extract.actionsdata').read_bytes())
          identifiers = {action['identifier'] for action in metadata['actions'].values()}
          expected = {'StartWorkoutAction', 'StartWithNoopAction', 'LogSetAction', 'SkipRestAction',
                      'ExtendRestAction', 'WorkoutStatusAction', 'FinishWorkoutAction', 'SaveWorkoutAction',
                      'OpenRoutinesAction', 'RestEndAction', 'RestRemainingAction',
                      'LogSetWithValuesAction', 'NextSetAction', 'WorkoutIslandIntent'}
          assert expected <= identifiers, sorted(expected - identifiers)
          for bundle in [root, *root.glob('PlugIns/*.appex')]:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              for key in ('CFBundleName', 'CFBundleIdentifier', 'CFBundleExecutable', 'CFBundleVersion', 'CFBundleShortVersionString'):
                  assert isinstance(info.get(key), str) and info[key].strip(), (bundle, key)
              assert (bundle / info['CFBundleExecutable']).is_file(), bundle
          PY
          cd dist
          zip -qry wger-RestIsland-Shortcuts.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: wger-RestIsland-IPA
          path: dist/wger-RestIsland-Shortcuts.ipa

  download:
    if: github.ref == 'refs/heads/feature/ios-workout-shortcuts' || github.ref == 'refs/heads/feature/ios-island-shortcuts'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wger-RestIsland-IPA
      - name: Publish SideStore download for this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="workout-shortcuts-${GITHUB_SHA:0:8}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" wger-RestIsland-Shortcuts.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" wger-RestIsland-Shortcuts.ipa --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "wger Rest Island · Workout-Kurzbefehle" \
              --notes "SideStore-IPA mit Live Activity für das ganze Workout (Buttons ab iOS 17) und 13 Kurzbefehle-Aktionen."
          fi
